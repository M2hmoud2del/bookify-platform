<span
      class="badge"
      [ngClass]="{
        'badge-primary': variant() === 'primary',
        'badge-success': variant() === 'success',
        'badge-warning': variant() === 'warning',
        'badge-danger': variant() === 'danger',
        'badge-gray': variant() === 'gray'
      }"
    >
      <ng-content />
    </span>
