<div class="edit-page">
      <div class="page-header">
        <a routerLink="/customer/profile" class="back-link">
          <span class="material-icons-outlined">arrow_back</span>
          Back to Profile
        </a>
        <h1 class="page-title">Edit Profile</h1>
      </div>

      <form class="edit-form" (ngSubmit)="onSubmit()" novalidate>
        <div *ngIf="authService.error()" class="global-error">
          <span class="material-icons-outlined">error_outline</span>
          {{ authService.error() }}
        </div>
        
        <!-- Avatar section -->
        <div class="avatar-section">
          <div class="avatar-preview">
            <img *ngIf="authService.user()?.avatar" [src]="authService.user()?.avatar" alt="Profile Photo" class="avatar-image">
            <span *ngIf="!authService.user()?.avatar" class="material-icons-outlined avatar-placeholder">person</span>
          </div>
          <div class="avatar-actions">
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none">
            <app-button variant="outline" size="sm" type="button" (click)="fileInput.click()" [loading]="uploadingAvatar()">
              <span class="material-icons-outlined">photo_camera</span>
              Change Photo
            </app-button>
            <app-button variant="ghost" size="sm" type="button" *ngIf="authService.user()?.avatar">
              <span class="material-icons-outlined">delete</span>
              Remove
            </app-button>
          </div>
        </div>

        <!-- Personal Info -->
        <div class="form-section">
          <h2 class="section-title">Personal Information</h2>
          <div class="form-row">
            <app-input
              label="First Name"
              type="text"
              placeholder="First name"
              [required]="true"
              [error]="firstNameError() ?? undefined"
              [(ngModel)]="firstName"
              name="firstName"
            />
            <app-input
              label="Last Name"
              type="text"
              placeholder="Last name"
              [required]="true"
              [error]="lastNameError() ?? undefined"
              [(ngModel)]="lastName"
              name="lastName"
            />
          </div>

          <app-input
            label="Email"
            type="email"
            placeholder="you@example.com"
            [required]="true"
            [error]="emailError() ?? undefined"
            [(ngModel)]="email"
            name="email"
          />

          <app-input
            label="Phone"
            type="tel"
            placeholder="+1 (555) 123-4567"
            [(ngModel)]="phone"
            name="phone"
          />
        </div>


        <!-- Actions -->
        <div class="form-actions">
          <app-button variant="outline" type="button" [routerLink]="['/customer/profile']">
            Cancel
          </app-button>
          <app-button variant="primary" type="submit" [loading]="saving()">
            <span class="material-icons-outlined">save</span>
            Save Changes
          </app-button>
        </div>
      </form>
    </div>
